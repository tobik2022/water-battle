# Apache 2.4 reverse proxy for Water Battle.
# Install as /etc/apache2/sites-available/bicik.net.conf and enable with:
#   a2enmod ssl proxy proxy_http headers rewrite
#   a2ensite bicik.net.conf
#   apache2ctl configtest && systemctl reload apache2
#
# The Node.js server listens privately on 127.0.0.1:3000.

<VirtualHost *:80>
    ServerName bicik.net

    # ACME HTTP-01 challenges must remain reachable during certificate issuance.
    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://bicik.net%{REQUEST_URI} [R=301,L]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName bicik.net

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/bicik.net/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/bicik.net/privkey.pem
    SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1
    Header always set Strict-Transport-Security "max-age=31536000"

    ProxyRequests Off
    ProxyPreserveHost On
    ProxyAddHeaders On
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    # Keep the canonical trailing slash so relative assets resolve correctly.
    RedirectMatch 301 ^/water_battle$ /water_battle/

    # ProxyPass strips /water_battle/ before forwarding to Node.js. The matching
    # trailing slashes are intentional. Long timeout and disabled buffering are
    # required for the backend's Server-Sent Events stream.
    ProxyPass        /water_battle/api/events http://127.0.0.1:3000/api/events connectiontimeout=5 timeout=3600
    ProxyPassReverse /water_battle/api/events http://127.0.0.1:3000/api/events
    ProxyPass        /water_battle/ http://127.0.0.1:3000/ connectiontimeout=5 timeout=60
    ProxyPassReverse /water_battle/ http://127.0.0.1:3000/

    <Location /water_battle/api/events>
        ProxyTimeout 3600
    </Location>

    # Movement/fire packets can be sent several times per second while a
    # player is active. Keep them out of the normal access log; low-frequency
    # room commands under /api/command remain logged there.
    SetEnvIf Request_URI "^/water_battle/api/input$" skip_realtime_log

    ErrorLog ${APACHE_LOG_DIR}/water-battle-error.log
    CustomLog ${APACHE_LOG_DIR}/water-battle-access.log combined env=!skip_realtime_log
</VirtualHost>
</IfModule>
